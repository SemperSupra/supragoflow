name: Public synthetic remote-lease contract
on:
  pull_request:
    paths:
      - 'rdte/remote-lease/**'
      - '.github/workflows/public-remote-lease-rdte.yml'
  push:
    branches:
      - 'agent/public-remote-lease-contract-*'
    paths:
      - 'rdte/remote-lease/**'
      - '.github/workflows/public-remote-lease-rdte.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
      - run: go test -count=1 -race ./... && go vet ./...
        working-directory: rdte/remote-lease
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
      - run: go test -count=1 ./...
        working-directory: rdte/remote-lease
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
      - run: go test -count=1 ./...
        working-directory: rdte/remote-lease
