name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHCR_ORG: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate output template rendering
        run: ./scripts/test-output-template.sh

      - name: Bootstrap
        run: ./scripts/gg bootstrap

      - name: Dependencies
        run: ./scripts/gg deps

      - name: Tidy
        run: |
          ./scripts/gg tidy
          git diff --exit-code

      - name: Format
        run: |
          ./scripts/gg fmt
          git diff --exit-code

      - name: Vet
        run: ./scripts/gg vet

      - name: Lint
        run: ./scripts/gg lint

      - name: Vulnerability check
        run: ./scripts/gg vuln

      - name: Test
        run: ./scripts/gg test

      - name: Build linux amd64
        run: ./scripts/gg build linux amd64

      - name: Build windows amd64
        run: ./scripts/gg build windows amd64

  windows_wine_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gates
    env:
      GHCR_ORG: ${{ github.repository_owner }}
      SUPRAGOFLOW_WINE_RUNNER_IMAGE: ${{ vars.SUPRAGOFLOW_WINE_RUNNER_IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate smoke runner image configuration
        run: |
          test -n "${SUPRAGOFLOW_WINE_RUNNER_IMAGE}" || (echo "Set repository variable SUPRAGOFLOW_WINE_RUNNER_IMAGE to a canonical Wine runner image." >&2; exit 2)

      - name: Build windows amd64
        run: ./scripts/gg build windows amd64

      - name: Wine smoke test
        run: ./scripts/gg smoke-windows
