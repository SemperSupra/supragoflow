name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      GHCR_ORG: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        run: ./scripts/gg bootstrap

      - name: Dependencies
        run: ./scripts/gg deps

      - name: Tidy
        run: |
          ./scripts/gg tidy
          git diff --exit-code

      - name: Format
        run: |
          ./scripts/gg fmt
          git diff --exit-code

      - name: Vet
        run: ./scripts/gg vet

      - name: Lint
        run: ./scripts/gg lint

      - name: Vulnerability check
        run: ./scripts/gg vuln

      - name: Test
        run: ./scripts/gg test

      - name: Build linux amd64
        run: ./scripts/gg build linux amd64

      - name: Build windows amd64
        run: ./scripts/gg build windows amd64

  windows_wine_smoke:
    runs-on: ubuntu-latest
    needs: gates
    env:
      GHCR_ORG: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build windows amd64
        run: ./scripts/gg build windows amd64

      - name: Wine smoke test
        run: ./scripts/gg smoke-windows
