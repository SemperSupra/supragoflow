name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHCR_ORG: ${{ github.repository_owner }}
      SUPRAGOFLOW_IMAGE_TAG: ${{ vars.SUPRAGOFLOW_IMAGE_TAG }}
      SUPRAGOFLOW_BUILD_IMAGE_REF: ${{ vars.SUPRAGOFLOW_BUILD_IMAGE_REF }}
      SUPRAGOFLOW_DEV_IMAGE_REF: ${{ vars.SUPRAGOFLOW_DEV_IMAGE_REF }}
      SUPRAGOFLOW_CACHE_STRATEGY: host
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Restore Go build/module cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/supragoflow/gocache
            .cache/supragoflow/gomodcache
          key: gg-cache-${{ runner.os }}-${{ hashFiles('**/go.sum', '.versions', 'docker/Dockerfile.build', 'docker/Dockerfile.dev') }}
          restore-keys: |
            gg-cache-${{ runner.os }}-

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate output template rendering
        run: ./scripts/test-output-template.sh

      - name: Bootstrap
        run: ./scripts/gg bootstrap

      - name: Dependencies
        run: ./scripts/gg deps

      - name: Tidy
        run: |
          ./scripts/gg tidy
          git diff --exit-code

      - name: Format
        run: |
          ./scripts/gg fmt
          git diff --exit-code

      - name: Vet
        run: ./scripts/gg vet

      - name: Lint
        run: ./scripts/gg lint

      - name: Vulnerability check (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/gg vuln

      - name: Test
        run: ./scripts/gg test

      - name: Build linux amd64
        run: ./scripts/gg build linux amd64

      - name: Build windows amd64 (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/gg build windows amd64

      - name: Upload windows artifact for smoke test (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supragoflow-windows-amd64
          path: dist/windows-amd64/supragoflow.exe
          if-no-files-found: error

      - name: Prune host cache to configured limit
        if: always()
        run: ./scripts/gg cache-prune

  windows_wine_smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gates
    env:
      GHCR_ORG: ${{ github.repository_owner }}
      SUPRAGOFLOW_IMAGE_TAG: ${{ vars.SUPRAGOFLOW_IMAGE_TAG }}
      SUPRAGOFLOW_BUILD_IMAGE_REF: ${{ vars.SUPRAGOFLOW_BUILD_IMAGE_REF }}
      SUPRAGOFLOW_DEV_IMAGE_REF: ${{ vars.SUPRAGOFLOW_DEV_IMAGE_REF }}
      SUPRAGOFLOW_CACHE_STRATEGY: host
      SUPRAGOFLOW_WINE_RUNNER_IMAGE: ${{ vars.SUPRAGOFLOW_WINE_RUNNER_IMAGE }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore Go build/module cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/supragoflow/gocache
            .cache/supragoflow/gomodcache
          key: gg-cache-${{ runner.os }}-${{ hashFiles('**/go.sum', '.versions', 'docker/Dockerfile.build', 'docker/Dockerfile.dev') }}
          restore-keys: |
            gg-cache-${{ runner.os }}-

      - name: Validate smoke runner image configuration
        run: |
          test -n "${SUPRAGOFLOW_WINE_RUNNER_IMAGE}" || (echo "Set repository variable SUPRAGOFLOW_WINE_RUNNER_IMAGE to a canonical Wine runner image." >&2; exit 2)

      - name: Download windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supragoflow-windows-amd64
          path: dist/windows-amd64

      - name: Wine smoke test
        run: ./scripts/gg smoke-windows

      - name: Prune host cache to configured limit
        if: always()
        run: ./scripts/gg cache-prune
