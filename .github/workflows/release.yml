name: Release (publish GHCR images)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to validate (e.g. v0.0.5)"
        required: true
      validate_only:
        description: "Run build + diagnostics only; skip immutable release-tag publish and release asset upload"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    concurrency:
      group: release-${{ github.event.release.tag_name || inputs.release_tag || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GHCR Org Name
        run: |
          echo "GHCR_ORG=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Load versions
        run: |
          cat .versions >> $GITHUB_ENV

      - name: Resolve release execution mode
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
            echo "VALIDATE_ONLY=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
            echo "VALIDATE_ONLY=${{ inputs.validate_only }}" >> "$GITHUB_ENV"
          fi
          echo "Release tag: ${RELEASE_TAG:-${{ github.event.release.tag_name || inputs.release_tag }}}"
          echo "Validate-only mode: ${VALIDATE_ONLY:-${{ inputs.validate_only || 'false' }}}"

      - name: Prepare release image refs
        run: |
          tag="${RELEASE_TAG}"
          tmp_suffix="tmp-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "BUILD_IMAGE_REF=ghcr.io/${{ env.GHCR_ORG }}/supragoflow-build:${tag}" >> $GITHUB_ENV
          echo "DEV_IMAGE_REF=ghcr.io/${{ env.GHCR_ORG }}/supragoflow-dev:${tag}" >> $GITHUB_ENV
          echo "BUILD_IMAGE_TMP_REF=ghcr.io/${{ env.GHCR_ORG }}/supragoflow-build:${tmp_suffix}" >> $GITHUB_ENV
          echo "DEV_IMAGE_TMP_REF=ghcr.io/${{ env.GHCR_ORG }}/supragoflow-dev:${tmp_suffix}" >> $GITHUB_ENV

      - name: Build & push build image (temporary tag)
        id: build_image_tmp
        timeout-minutes: 15
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.build
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=release-build
          cache-to: type=gha,scope=release-build,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            DEBIAN_BASE=${{ env.DEBIAN_BASE }}
          tags: |
            ${{ env.BUILD_IMAGE_TMP_REF }}

      - name: Resolve existing build release tag digest
        if: env.VALIDATE_ONLY != 'true'
        id: build_existing
        run: |
          existing_digest="$(./scripts/release-tag-immutability.sh resolve-existing "${BUILD_IMAGE_REF}")"
          echo "existing_digest=${existing_digest}" >> "$GITHUB_OUTPUT"

      - name: Enforce build image tag immutability
        if: env.VALIDATE_ONLY != 'true'
        env:
          SUPRAGOFLOW_ALLOW_TAG_OVERWRITE: ${{ vars.SUPRAGOFLOW_ALLOW_TAG_OVERWRITE || 'false' }}
        run: |
          ./scripts/release-tag-immutability.sh evaluate \
            "${BUILD_IMAGE_REF}" \
            "${{ steps.build_existing.outputs.existing_digest }}" \
            "${{ steps.build_image_tmp.outputs.digest }}"

      - name: Publish build release tag
        if: env.VALIDATE_ONLY != 'true'
        run: |
          docker buildx imagetools create \
            -t "${BUILD_IMAGE_REF}" \
            "ghcr.io/${{ env.GHCR_ORG }}/supragoflow-build@${{ steps.build_image_tmp.outputs.digest }}"

      - name: Build & push dev image (temporary tag)
        id: dev_image_tmp
        timeout-minutes: 25
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=release-dev
          cache-to: type=gha,scope=release-dev,mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}
            GOVULNCHECK_VERSION=${{ env.GOVULNCHECK_VERSION }}
            GOTESTSUM_VERSION=${{ env.GOTESTSUM_VERSION }}
            DEBIAN_BASE=${{ env.DEBIAN_BASE }}
          tags: |
            ${{ env.DEV_IMAGE_TMP_REF }}

      - name: Resolve existing dev release tag digest
        if: env.VALIDATE_ONLY != 'true'
        id: dev_existing
        run: |
          existing_digest="$(./scripts/release-tag-immutability.sh resolve-existing "${DEV_IMAGE_REF}")"
          echo "existing_digest=${existing_digest}" >> "$GITHUB_OUTPUT"

      - name: Enforce dev image tag immutability
        if: env.VALIDATE_ONLY != 'true'
        env:
          SUPRAGOFLOW_ALLOW_TAG_OVERWRITE: ${{ vars.SUPRAGOFLOW_ALLOW_TAG_OVERWRITE || 'false' }}
        run: |
          ./scripts/release-tag-immutability.sh evaluate \
            "${DEV_IMAGE_REF}" \
            "${{ steps.dev_existing.outputs.existing_digest }}" \
            "${{ steps.dev_image_tmp.outputs.digest }}"

      - name: Publish dev release tag
        if: env.VALIDATE_ONLY != 'true'
        run: |
          docker buildx imagetools create \
            -t "${DEV_IMAGE_REF}" \
            "ghcr.io/${{ env.GHCR_ORG }}/supragoflow-dev@${{ steps.dev_image_tmp.outputs.digest }}"

      - name: Build release binaries for SBOM
        timeout-minutes: 15
        env:
          SUPRAGOFLOW_CACHE_STRATEGY: host
          SUPRAGOFLOW_HOST_CACHE_ROOT: ${{ runner.temp }}/supragoflow-cache
          SUPRAGOFLOW_HEARTBEAT_SEC: 10
          SUPRAGOFLOW_HEARTBEAT_RESOURCE: 1
          SUPRAGOFLOW_LOG_LEVEL: debug
        run: |
          set -euo pipefail
          diagnostics_dir="dist/diagnostics/release-sbom"
          mkdir -p "${diagnostics_dir}"
          log_file="${diagnostics_dir}/sbom-build.log"
          touch "${log_file}"
          exec > >(tee -a "${log_file}") 2>&1

          capture_failure_diagnostics() {
            local failed_cmd="$1"
            local failed_exit="$2"
            echo "[release][error] command failed: ${failed_cmd} (exit=${failed_exit})"
            ./scripts/gg diagnose "${diagnostics_dir}" || true
            docker ps -a > "${diagnostics_dir}/docker-ps.txt" 2>&1 || true
            docker image ls > "${diagnostics_dir}/docker-images.txt" 2>&1 || true
            docker system df > "${diagnostics_dir}/docker-system-df.txt" 2>&1 || true
          }

          run_with_retry_or_capture() {
            local cmd="$1"
            local attempts="${2:-3}"
            local backoff_sec="${3:-5}"
            local attempt
            local rc=0
            for attempt in $(seq 1 "${attempts}"); do
              echo "[release][liveness] attempt ${attempt}/${attempts}: ${cmd}"
              set +e
              eval "${cmd}"
              rc="$?"
              set -e
              if [[ "${rc}" -eq 0 ]]; then
                return 0
              fi
              echo "[release][warn] attempt ${attempt}/${attempts} failed (exit=${rc})"
              if [[ "${attempt}" -lt "${attempts}" ]]; then
                echo "[release][liveness] retrying in ${backoff_sec}s"
                sleep "${backoff_sec}"
              fi
            done
            capture_failure_diagnostics "${cmd}" "${rc}"
            return "${rc}"
          }

          echo "[release][liveness] starting SBOM binary builds at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[release][liveness] building linux amd64 binary"
          run_with_retry_or_capture "SUPRAGOFLOW_BUILD_VERSION=${RELEASE_TAG} ./scripts/gg build linux amd64" 3 5
          echo "[release][liveness] building windows amd64 binary"
          run_with_retry_or_capture "SUPRAGOFLOW_BUILD_VERSION=${RELEASE_TAG} ./scripts/gg build windows amd64" 3 5
          echo "[release][liveness] completed SBOM binary builds at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SBOM (build image)
        if: env.VALIDATE_ONLY != 'true'
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0
        with:
          image: ${{ env.BUILD_IMAGE_REF }}
          format: spdx-json
          output-file: sbom-supragoflow-build-image.spdx.json

      - name: Generate SBOM (dev image)
        if: env.VALIDATE_ONLY != 'true'
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0
        with:
          image: ${{ env.DEV_IMAGE_REF }}
          format: spdx-json
          output-file: sbom-supragoflow-dev-image.spdx.json

      - name: Generate SBOM (linux binary)
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0
        with:
          path: dist/linux-amd64
          format: spdx-json
          output-file: sbom-supragoflow-linux-amd64.spdx.json

      - name: Generate SBOM (windows binary)
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0
        with:
          path: dist/windows-amd64
          format: spdx-json
          output-file: sbom-supragoflow-windows-amd64.spdx.json

      - name: Upload SBOM assets to release
        if: env.VALIDATE_ONLY != 'true'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            sbom-supragoflow-build-image.spdx.json
            sbom-supragoflow-dev-image.spdx.json
            sbom-supragoflow-linux-amd64.spdx.json
            sbom-supragoflow-windows-amd64.spdx.json
