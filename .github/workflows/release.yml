name: Release (publish GHCR images)

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GHCR Org Name
        run: |
          echo "GHCR_ORG=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Load versions
        run: |
          cat .versions >> $GITHUB_ENV

      - name: Build & push build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.build
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            DEBIAN_BASE=${{ env.DEBIAN_BASE }}
          tags: |
            ghcr.io/${{ env.GHCR_ORG }}/supragoflow-build:${{ github.event.release.tag_name }}

      - name: Build & push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}
            GOVULNCHECK_VERSION=${{ env.GOVULNCHECK_VERSION }}
            GOTESTSUM_VERSION=${{ env.GOTESTSUM_VERSION }}
            DEBIAN_BASE=${{ env.DEBIAN_BASE }}
          tags: |
            ghcr.io/${{ env.GHCR_ORG }}/supragoflow-dev:${{ github.event.release.tag_name }}
