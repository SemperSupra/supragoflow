name: Public ephemeral SSH cert loopback admission and revoke

on:
  pull_request:
    branches: [main]
    paths:
      - "rdte/public-ssh-lease/**"
      - ".github/workflows/public-ssh-lease-rdte.yml"
  push:
    branches: [experiment/issue-595-ssh-cert-loopback]
    paths:
      - "rdte/public-ssh-lease/**"
      - ".github/workflows/public-ssh-lease-rdte.yml"

permissions:
  contents: read

concurrency:
  group: public-ssh-cert-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rdte/public-ssh-lease
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.13'
          cache: false
      - name: Race-tested fresh SSH cert and negative action matrix
        run: |
          go mod verify
          go test -count=1 -race ./...
          go vet ./...
          go run ./cmd/ssh-canary > /tmp/ssh-canary-receipt.json
          grep -q '"verdict":"PASS"' /tmp/ssh-canary-receipt.json
          grep -q '"provider_effects":"NONE"' /tmp/ssh-canary-receipt.json
          cat /tmp/ssh-canary-receipt.json

  windows-native:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rdte/public-ssh-lease
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.13'
          cache: false
      - name: Native Windows full SSH handshake and revocation tests
        run: |
          go mod verify
          go test -count=1 ./...
          go vet ./...
          $r = go run ./cmd/ssh-canary | Out-String | ConvertFrom-Json
          if ($r.verdict -ne 'PASS' -or $r.provider_effects -ne 'NONE' -or $r.persistent_keys) {
            throw 'ephemeral SSH canary failed'
          }

  macos-native:
    runs-on: macos-15
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rdte/public-ssh-lease
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.13'
          cache: false
      - name: Native macOS short-lived SSH certificate protocol
        run: |
          go mod verify
          go test -count=1 ./...
          go vet ./...
          go run ./cmd/ssh-canary
